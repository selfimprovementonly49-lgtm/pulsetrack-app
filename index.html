<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PulseTrack App</title>
  
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PulseTrack" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --secondary: #9d4edd;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --nav-height: 68px;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(157, 78, 221, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.14) 0%, transparent 45%);
      background-attachment: fixed;
    }

    /* App Shell Container */
    .app-container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 0 16px;
      flex: 1;
    }

    /* --- App Header --- */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: grid;
      place-items: center;
      color: #000;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.3);
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .key-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* --- Views Controller --- */
    .view-section {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Action Logger Input Box --- */
    .action-input-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1rem;
      padding: 8px 4px;
    }

    .action-input::placeholder {
      color: #64748b;
    }

    .voice-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .voice-btn.recording {
      background: var(--danger);
      animation: pulse-ring 1.4s infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .input-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .pill-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.8rem;
      outline: none;
    }

    .pill-select option {
      background: #111726;
      color: #fff;
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Filter Chips */
    .chip-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip-btn.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* --- List Cards --- */
    .action-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .check-btn {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid #64748b;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .action-card.done .check-btn {
      background: var(--success);
      border-color: var(--success);
    }

    .action-card.done .action-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .action-title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .action-text {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.35;
    }

    .action-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .badge-tag {
      text-transform: uppercase;
      font-weight: 700;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-tag.work { color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
    .badge-tag.study { color: #a78bfa; background: rgba(167, 139, 250, 0.15); }
    .badge-tag.fitness { color: #4ade80; background: rgba(74, 222, 128, 0.15); }
    .badge-tag.personal { color: #fbbf24; background: rgba(251, 191, 36, 0.15); }

    .delete-action-btn {
      background: none;
      border: none;
      color: #64748b;
      padding: 4px;
      cursor: pointer;
    }

    /* --- Gemini AI View --- */
    .ai-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .ai-action-tile {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      color: var(--text-main);
      text-align: left;
    }

    .ai-action-tile i {
      color: var(--primary);
    }

    .ai-action-tile span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .ai-card-output {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      min-height: 200px;
      max-height: 380px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      margin-bottom: 14px;
    }

    .ai-chat-input-bar {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 6px 8px;
    }

    .ai-chat-input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      padding: 6px;
      font-size: 0.9rem;
    }

    /* --- Mobile App Bottom Navigation Bar --- */
    .bottom-navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--nav-height) + var(--safe-bottom));
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 8px;
      z-index: 100;
    }

    .nav-tab {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      width: 70px;
    }

    .nav-tab.active {
      color: var(--primary);
    }

    .nav-tab.active i {
      transform: translateY(-2px);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      place-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: grid;
    }

    .modal-sheet {
      background: #111726;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
    }

    .modal-sheet input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      margin: 14px 0;
      outline: none;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="brand-title">
        <div class="brand-logo">
          <i data-lucide="zap" style="width: 20px; height: 20px;"></i>
        </div>
        <div>
          <h1>PulseTrack</h1>
        </div>
      </div>
      <button class="key-btn" id="openKeyModal">
        <i data-lucide="key" style="width: 14px; height: 14px;"></i>
        <span id="keyStateLabel">API Key</span>
      </button>
    </header>

    <main id="actionsView" class="view-section active">
      <div class="action-input-card">
        <div class="input-row">
          <button class="voice-btn" id="voiceMicBtn" title="Speak to log action">
            <i data-lucide="mic" style="width: 20px; height: 20px;"></i>
          </button>
          <input 
            type="text" 
            class="action-input" 
            id="actionText" 
            placeholder="Log action or tap mic..." 
            autocomplete="off"
          />
        </div>
        <div class="input-meta-row">
          <select class="pill-select" id="actionCategory">
            <option value="work">Work</option>
            <option value="study">Study</option>
            <option value="fitness">Fitness</option>
            <option value="personal">Personal</option>
          </select>
          <button class="submit-btn" id="submitActionBtn">Log Action</button>
        </div>
      </div>

      <div class="chip-container">
        <button class="chip-btn active" data-filter="all">All Logs</button>
        <button class="chip-btn" data-filter="pending">To-Do</button>
        <button class="chip-btn" data-filter="completed">Done</button>
      </div>

      <div class="action-list" id="actionList">
        </div>
    </main>

    <section id="aiView" class="view-section">
      <div class="ai-grid">
        <button class="ai-action-tile" id="aiBtnSummary">
          <i data-lucide="sparkles" style="width: 20px; height: 20px;"></i>
          <span>Daily Summary</span>
        </button>
        <button class="ai-action-tile" id="aiBtnPriorities">
          <i data-lucide="compass" style="width: 20px; height: 20px;"></i>
          <span>Top Priorities</span>
        </button>
        <button class="ai-action-tile" id="aiBtnReview">
          <i data-lucide="activity" style="width: 20px; height: 20px;"></i>
          <span>Score & Feedback</span>
        </button>
        <button class="ai-action-tile" id="aiBtnNextSteps">
          <i data-lucide="arrow-up-right" style="width: 20px; height: 20px;"></i>
          <span>Next Focus</span>
        </button>
      </div>

      <div class="ai-card-output" id="aiOutputBox">Tap an AI quick option or ask a question below to analyze your day with Gemini!</div>

      <div class="ai-chat-input-bar">
        <input type="text" id="aiCustomInput" placeholder="Ask Gemini about your actions..." />
        <button class="submit-btn" id="aiSendPromptBtn">
          <i data-lucide="send" style="width: 14px; height: 14px;"></i>
        </button>
      </div>
    </section>

  </div>

  <nav class="bottom-navbar">
    <button class="nav-tab active" id="tabActions">
      <i data-lucide="check-square" style="width: 22px; height: 22px;"></i>
      <span>Actions</span>
    </button>
    <button class="nav-tab" id="tabAI">
      <i data-lucide="bot" style="width: 22px; height: 22px;"></i>
      <span>Gemini</span>
    </button>
  </nav>

  <div class="modal-overlay" id="keyModal">
    <div class="modal-sheet">
      <h3 style="font-size: 1.1rem; margin-bottom: 6px;">Gemini API Configuration</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Enter your Google Gemini API key to activate voice insights and daily reviews.</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="key-btn" id="closeKeyModal">Cancel</button>
        <button class="submit-btn" id="saveKeyBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    // --- Application State ---
    let actions = JSON.parse(localStorage.getItem('app_actions_db')) || [];
    let filter = 'all';
    let apiKey = localStorage.getItem('gemini_api_key') || '';

    // Initialize Lucide Icons
    lucide.createIcons();

    // DOM Elements
    const actionsView = document.getElementById('actionsView');
    const aiView = document.getElementById('aiView');
    const tabActions = document.getElementById('tabActions');
    const tabAI = document.getElementById('tabAI');

    const actionText = document.getElementById('actionText');
    const actionCategory = document.getElementById('actionCategory');
    const submitActionBtn = document.getElementById('submitActionBtn');
    const voiceMicBtn = document.getElementById('voiceMicBtn');
    const actionList = document.getElementById('actionList');
    const chipBtns = document.querySelectorAll('.chip-btn');

    const keyModal = document.getElementById('keyModal');
    const openKeyModal = document.getElementById('openKeyModal');
    const closeKeyModal = document.getElementById('closeKeyModal');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const keyStateLabel = document.getElementById('keyStateLabel');

    const aiOutputBox = document.getElementById('aiOutputBox');
    const aiCustomInput = document.getElementById('aiCustomInput');
    const aiSendPromptBtn = document.getElementById('aiSendPromptBtn');

    // Tab Navigation
    tabActions.addEventListener('click', () => {
      tabActions.classList.add('active');
      tabAI.classList.remove('active');
      actionsView.classList.add('active');
      aiView.classList.remove('active');
    });

    tabAI.addEventListener('click', () => {
      tabAI.classList.add('active');
      tabActions.classList.remove('active');
      aiView.classList.add('active');
      actionsView.classList.remove('active');
    });

    // API Key Indicator
    function refreshKeyUI() {
      if (apiKey) {
        keyStateLabel.textContent = "Connected";
        keyStateLabel.style.color = "var(--success)";
      } else {
        keyStateLabel.textContent = "Set API Key";
        keyStateLabel.style.color = "var(--text-main)";
      }
    }
    refreshKeyUI();

    // --- Save and Render Actions ---
    function saveAndRender() {
      localStorage.setItem('app_actions_db', JSON.stringify(actions));
      renderList();
    }

    function renderList() {
      actionList.innerHTML = '';

      const filtered = actions.filter(item => {
        if (filter === 'pending') return !item.completed;
        if (filter === 'completed') return item.completed;
        return true;
      });

      if (filtered.length === 0) {
        actionList.innerHTML = `
          <div class="empty-state">
            <i data-lucide="layers" style="width: 32px; height: 32px; opacity: 0.3; margin-bottom: 8px;"></i>
            <p>No actions logged yet. Speak or type above!</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      filtered.forEach(action => {
        const card = document.createElement('div');
        card.className = `action-card ${action.completed ? 'done' : ''}`;
        
        card.innerHTML = `
          <div class="action-left">
            <button class="check-btn" onclick="toggleAction('${action.id}')">
              ${action.completed ? '<i data-lucide="check" style="width:14px; height:14px; color:#fff;"></i>' : ''}
            </button>
            <div class="action-title-group">
              <span class="action-text">${escapeHtml(action.text)}</span>
              <div class="action-sub">
                <span class="badge-tag ${action.category}">${action.category}</span>
                <span>${action.time}</span>
              </div>
            </div>
          </div>
          <button class="delete-action-btn" onclick="deleteAction('${action.id}')">
            <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
          </button>
        `;
        actionList.appendChild(card);
      });

      lucide.createIcons();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addAction(text, cat) {
      if (!text.trim()) return;
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      actions.unshift({
        id: Date.now().toString(),
        text: text.trim(),
        category: cat || 'work',
        completed: false,
        time: time
      });

      saveAndRender();
      actionText.value = '';
    }

    window.toggleAction = function(id) {
      actions = actions.map(act => act.id === id ? { ...act, completed: !act.completed } : act);
      saveAndRender();
    };

    window.deleteAction = function(id) {
      actions = actions.filter(act => act.id !== id);
      saveAndRender();
    };

    // Filter Chips Event
    chipBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        chipBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filter = btn.dataset.filter;
        renderList();
      });
    });

    submitActionBtn.addEventListener('click', () => addAction(actionText.value, actionCategory.value));
    actionText.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addAction(actionText.value, actionCategory.value);
    });

    // --- Voice Recognition ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer;

    if (SpeechRecognition) {
      recognizer = new SpeechRecognition();
      recognizer.continuous = false;
      recognizer.interimResults = false;
      recognizer.lang = 'en-US';

      recognizer.onstart = () => voiceMicBtn.classList.add('recording');
      recognizer.onend = () => voiceMicBtn.classList.remove('recording');
      recognizer.onerror = () => voiceMicBtn.classList.remove('recording');

      recognizer.onresult = (e) => {
        const voiceText = e.results[0][0].transcript;
        actionText.value = voiceText;
        addAction(voiceText, actionCategory.value);
      };

      voiceMicBtn.addEventListener('click', () => {
        try { recognizer.start(); } catch (e) { recognizer.stop(); }
      });
    }

    // --- Gemini Assistant Integration ---
    async function queryGemini(prompt) {
      if (!apiKey) {
        keyModal.classList.add('active');
        aiOutputBox.textContent = "⚠️ Please configure your Gemini API Key first.";
        return;
      }

      aiOutputBox.textContent = "⚡ Analyzing your actions with Gemini...";

      const actionHistory = actions.map((a, i) => `${i+1}. [${a.category.toUpperCase()}] ${a.text} (Status: ${a.completed ? 'Done' : 'Pending'}, Time: ${a.time})`).join('\n');

      const fullPrompt = `You are a high-speed personal productivity assistant on a mobile app.
Here is the user's daily activity stream:
${actionHistory || "No actions logged yet."}

User Question/Request:
${prompt}

Provide a short, direct, highly readable mobile-friendly summary with bullet points.`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: fullPrompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        aiOutputBox.textContent = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
      } catch (err) {
        aiOutputBox.textContent = `❌ Error: ${err.message}`;
      }
    }

    // AI Triggers
    document.getElementById('aiBtnSummary').addEventListener('click', () => queryGemini("Summarize my entire day in 3 key takeaways."));
    document.getElementById('aiBtnPriorities').addEventListener('click', () => queryGemini("Look at my uncompleted tasks and rank the top 2 urgent items."));
    document.getElementById('aiBtnReview').addEventListener('click', () => queryGemini("Rate my daily balance (work, study, fitness) and give 1 quick improvement tip."));
    document.getElementById('aiBtnNextSteps').addEventListener('click', () => queryGemini("Based on what I completed today, suggest 2 immediate next actions."));

    aiSendPromptBtn.addEventListener('click', () => {
      if (aiCustomInput.value.trim()) {
        queryGemini(aiCustomInput.value.trim());
        aiCustomInput.value = '';
      }
    });

    aiCustomInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && aiCustomInput.value.trim()) {
        queryGemini(aiCustomInput.value.trim());
        aiCustomInput.value = '';
      }
    });

    // Key Modal
    openKeyModal.addEventListener('click', () => {
      apiKeyInput.value = apiKey;
      keyModal.classList.add('active');
    });

    closeKeyModal.addEventListener('click', () => keyModal.classList.remove('active'));

    saveKeyBtn.addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('gemini_api_key', apiKey);
      refreshKeyUI();
      keyModal.classList.remove('active');
    });

    // Service Worker for App Installation
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // Initial render
    renderList();
  </script>
</body>
</html>
